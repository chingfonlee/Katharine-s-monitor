name: 排程測試（不連網站）

# 只用來觀察排程實際落在幾點，完全不請求 kaofarmers.tw，不會增加瀏覽數。
# 每次觸發會在 repo 的 schedule_log.csv 追加一列，方便確認排程有沒有真的執行。
# 測完請刪除這個檔案，避免白白用掉免費額度。
on:
  schedule:
    - cron: "7,41 0-9 * * *"
    - cron: "13 0-23 * * *"
    - cron: "29 1,5,9,13,17,21 * * *"
  workflow_dispatch:

permissions:
  contents: write # 需要把 CSV 寫回 repo

concurrency:
  group: schedule-log # 避免兩次同時執行時互相衝突
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: 追加一列到 schedule_log.csv
        run: |
          FILE=schedule_log.csv
          if [ ! -f "$FILE" ]; then
            printf '\xEF\xBB\xBF' > "$FILE"
            echo "觸發方式,排程設定,UTC時間,台灣時間" >> "$FILE"
          fi
          echo "${{ github.event_name }},\"${{ github.event.schedule }}\",$(date -u '+%F %T'),$(TZ=Asia/Taipei date '+%F %T')" >> "$FILE"
          tail -n 3 "$FILE"
          {
            echo "### 已寫入 schedule_log.csv"
            echo '```'
            tail -n 5 "$FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 寫回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule_log.csv
          git commit -m "log: 排程測試紀錄 ${{ github.event_name }}"
          git pull --rebase origin main
          git push
