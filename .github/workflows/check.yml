name: 每日檢查型農本色連結

on:
  schedule:
    # GitHub 排程用 UTC 時間：01:17 UTC = 台灣時間 09:17
    # （避開整點，整點時 GitHub 排程常塞車延遲）
    
    - cron: "7,41 0-9 * * *"        # 10 個小時 × 2 次 = 20 次
    - cron: "13 0-23 * * *"         # 每小時 1 次 = 24 次
    - cron: "29 1,5,9,13,17,21 * * *"  # 6 次
  
  workflow_dispatch: # 允許在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write # 需要把 view_history.csv 寫回 repo

concurrency:
  group: view-history # 避免兩次同時執行時寫入衝突
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install httpx

      - name: 檢查 12 個網址的連線與瀏覽次數
        run: python check_status.py

      - name: 把歷史紀錄 view_history.csv 寫回 repo
        if: always() # 網址失敗時也要留下紀錄
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add view_history.csv
          git commit -m "log: 瀏覽次數檢查紀錄 ${{ github.event_name }}" || exit 0
          git pull --rebase origin main
          git push

      - name: 保存 CSV 結果（保留 90 天）
        if: always() # 就算有網址失敗也要保存結果
        uses: actions/upload-artifact@v4
        with:
          name: views-${{ github.run_number }}
          path: views_*.csv
          retention-days: 90
