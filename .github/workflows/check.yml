name: 每日檢查型農本色連結

on:
  schedule:
    # GitHub 排程用 UTC 時間：01:17 UTC = 台灣時間 09:17
    # （避開整點，整點時 GitHub 排程常塞車延遲）
    - cron: "17 1 * * *"
  workflow_dispatch: # 允許在 Actions 頁面手動按「Run workflow」

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install httpx

      - name: 檢查 12 個網址的連線與瀏覽次數
        run: python check_status.py

      - name: 保存 CSV 結果（保留 90 天）
        if: always() # 就算有網址失敗也要保存結果
        uses: actions/upload-artifact@v4
        with:
          name: views-${{ github.run_number }}
          path: views_*.csv
          retention-days: 90
