name: 每日檢查型農本色連結

on:
  # 改由 Cloudflare Workers Cron (farmermage-cron) 每天 50 次穩定觸發
  # （每小時 :22、:52 ＋ 台灣時間 00:44、12:44，與 nufantex/farmermage 錯開）
  workflow_dispatch: # 允許在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write # 需要把 view_history.csv 寫回 repo

concurrency:
  group: view-history # 避免兩次同時執行時寫入衝突
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 檢查 26 個網址的連線與瀏覽次數（Vol.54 + Vol.53）
        run: python check_status.py

      - name: 把歷史紀錄 view_history.csv 寫回 repo
        if: always() # 網址失敗時也要留下紀錄
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add view_history.csv
          git commit -m "log: 瀏覽次數檢查紀錄 ${{ github.event_name }}" || exit 0
          git pull --rebase origin main
          git push

      - name: 保存 CSV 結果（保留 90 天）
        if: always() # 就算有網址失敗也要保存結果
        uses: actions/upload-artifact@v4
        with:
          name: views-${{ github.run_number }}
          path: views_*.csv
          retention-days: 90
